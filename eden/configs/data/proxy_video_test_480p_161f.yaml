defaults:
  - data: proxy_video_test

# Wan2.1-I2V-14B 480P inference: 832x480 geometry at 16 fps. Proxy-DINO reads the
# source clip on the *decoded* timeline (one control frame per decoded frame) and
# the adapter strides every 4th itself, so the control clip spans the full 161
# decoded frames rather than the 41 latent positions.
data:
  dataset:
    params:
      columns:
        proxy_video:
          params:
            sampling: fps
            fps: 16
            clip_position: start
            num_frames: 161
            height: 480
            width: 832
        first_frame:
          params:
            height: 480
            width: 832
