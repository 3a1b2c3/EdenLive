defaults:
  - data: proxy_video_test

# Wan2.1-I2V-14B 480P inference: 832x480 at 16 fps, matching the training recipes'
# validation geometry (81 decoded frames -> 21 latent frames).
#
# Proxy-DINO reads the source clip on the *decoded* timeline and the adapter strides
# every 4th frame itself, so the control clip spans all 81 decoded frames rather than
# the 21 latent positions.
data:
  dataset:
    params:
      columns:
        proxy_video:
          params:
            sampling: fps
            fps: 16
            clip_position: start
            num_frames: 81
            pad_short: false
            duration_seconds: null
            height: 480
            width: 832
        first_frame:
          params:
            height: 480
            width: 832
