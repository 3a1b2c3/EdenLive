# Wan2.1-I2V-14B (480p) + Proxy-DINO — bidirectional SFT, cfg_unconditional_control: same.
#
# Mirrors the training recipe's own validation block, so a checkpoint from that run is
# sampled the way it was evaluated during training.
#
# `same` keeps the source-video proxy control in *both* CFG branches, so guidance varies
# text only. A checkpoint trained with `zero` — where the unconditional branch drops proxy
# control — needs `cfg_unconditional_control: zero` here; the two are not interchangeable.
#
# Frame math @16fps: 81 decoded -> 21 latent frames.
defaults:
  - models: wan21_i2v_14b_480p_proxy_dino_channel_concat
  - runtime: fsdp2_sp
  - data: proxy_video_test_480p_81f

model:
  gradient_checkpointing: false
  proxy_dino:
    cfg_unconditional_control: same
    # Offline inference decodes RGB source clips; cached target latents are training-only.
    use_cached_latents: false
    video_context_time_axis: decoded
  image_condition:
    # The training recipe uses cached_grey_tail, which reads the *target's* cached latent.
    # Inference has no target, so encode the condition clip online — the released encoding.
    first_frame_encoding: masked_video

runtime:
  attention_backend: {enabled: true, backend: native}
  sequence_parallel: {enabled: true, size: 1, axis: temporal, layout: balanced_blocks}
  torch_compile: {enabled: false}

inference:
  strategy: diffusion
  outputs: [video]
  checkpoint: /path/to/ckpts/14b_480p/bidir_same
  checkpoint_source: ema
  output_dir: inference/wan21_14b_480p_bidir_same
  max_batches: 0
  num_samples: 1
  height: 480
  width: 832
  num_frames: 81
  fps: 16
  num_inference_steps: 30
  guidance_scale: 5.0
  use_image_condition: true
  seed: 42
  output_type: np
  save_condition_videos: {video_context: proxy}
  scheduler:
    name: flow_euler
    schedule: shifted_linear
    shift: 3.0
    stretch: false
