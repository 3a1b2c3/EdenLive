# Wan2.1-I2V-14B (480p) + Proxy-DINO, teacher-forcing chunk-AR inference.
#
# Same model as the bidir config but the chunk_causal strategy with a KV cache.
# 10s (161 decoded) and 15s (241 decoded) at 16fps.
#
# Frame math (16fps, inclusive endpoint):
#   10s: 161 decoded -> 41 latent (not divisible by 3; last chunk has 2 frames)
#   15s: 241 decoded -> 61 latent (not divisible by 3; last chunk has 1 frame)
#   The chunk_causal manager handles partial tails via min(chunk_size, remaining).
#
# KV window: capped at 21 latent frames (a 5s training clip) so the cache does not
# grow unbounded. For 10s (41 latent) and 15s (61 latent) the sliding window is active.
defaults:
  - models: wan21_i2v_14b_480p_proxy_dino_channel_concat
  - runtime: fsdp2_sp_kv
  - data: proxy_video_test_480p_161f

model:
  gradient_checkpointing: false

runtime:
  # Diffusers resolves DIFFUSERS_ATTN_BACKEND when its attention dispatch module is
  # imported, so a non-native backend must be exported before Python starts:
  #   DIFFUSERS_ATTN_BACKEND=flash python -m eden.scripts.infer ... \
  #     runtime.attention_backend.backend=flash
  # The plugin hard-fails on a mismatch rather than silently running native.
  attention_backend: {enabled: true, backend: native}
  sequence_parallel: {enabled: true, size: 1, axis: temporal, layout: balanced_blocks}
  kv_cache:
    enabled: true
    offload_generated_chunks: true
    context:
      max_latent_frames: 21
      sink_latent_frames: 0
      debug_window: false
    quantized: false
    compression: none
  torch_compile: {enabled: false}

inference:
  strategy: chunk_causal
  outputs: [video]
  # TODO: point at a checkpoint produced by the teacher-forcing recipe. Do not use a
  # bidirectional initialization checkpoint here -- chunk-AR quality depends on the
  # teacher-forcing stage.
  checkpoint: /path/to/checkpoints/step_000000
  output_dir: inference/wan21_i2v_14b_480p_proxy_dino_tf_chunkar
  max_batches: 0
  num_samples: 1
  height: 480
  width: 832
  num_frames: 161
  fps: 16
  chunk_size: 3
  pack_first_frame: true
  independent_first_frame: true
  num_inference_steps: 30
  guidance_scale: 5.0
  use_image_condition: true
  seed: 42
  output_type: np
  save_condition_videos: {video_context: proxy}
  scheduler:
    name: flow_euler
    schedule: shifted_linear
    shift: 3.0
    stretch: false
