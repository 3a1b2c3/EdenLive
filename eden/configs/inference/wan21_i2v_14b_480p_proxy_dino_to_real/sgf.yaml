# Wan2.1-I2V-14B (480p) + Proxy-DINO — self-gradient-forcing (rollout DMD), 4-step.
#
# Mirrors the training recipe's validation block.
#
# Two settings distinguish it from the teacher-forcing config: an explicit four-entry
# timestep list, and a bounded KV window (18 latent frames + 6 sink) rather than
# unbounded context.
defaults:
  - models: wan21_i2v_14b_480p_proxy_dino_channel_concat
  - runtime: fsdp2_sp_kv
  - data: proxy_video_test_480p_81f

model:
  gradient_checkpointing: false
  proxy_dino:
    cfg_unconditional_control: zero
    use_cached_latents: false
    video_context_time_axis: decoded
  image_condition:
    # Training used cached_grey_tail (reads the target's cached latent). Inference has no
    # target, so encode the condition clip online — the released encoding.
    first_frame_encoding: masked_video

runtime:
  attention_backend: {enabled: true, backend: native}
  sequence_parallel: {enabled: true, size: 1, axis: temporal, layout: balanced_blocks}
  kv_cache:
    enabled: true
    offload_generated_chunks: true
    context:
      max_latent_frames: 18
      sink_latent_frames: 6
      debug_window: false
    quantized: false
    compression: none
  torch_compile: {enabled: false}

inference:
  strategy: chunk_causal
  outputs: [video]
  checkpoint: /path/to/ckpts/14b_480p/sgf
  checkpoint_source: ema
  output_dir: inference/wan21_14b_480p_sgf
  max_batches: 0
  num_samples: 1
  height: 480
  width: 832
  num_frames: 81
  fps: 16
  chunk_size: 3
  pack_first_frame: true
  independent_first_frame: true
  num_inference_steps: 4
  guidance_scale: 1.0
  use_image_condition: true
  seed: 42
  output_type: np
  save_condition_videos: {video_context: proxy}
  scheduler:
    name: flow_euler
    stochastic_sampling: true
    timesteps: [1000, 900.0, 750.0, 500.0]
