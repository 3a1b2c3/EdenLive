# Wan2.1-I2V-14B (480p) + Proxy-DINO — teacher-forcing SFT, chunk-AR inference.
#
# Mirrors the training recipe's validation block.
#
# 81 decoded @16fps -> 21 latent frames. chunk_size 3 + independent_first_frame +
# pack_first_frame => 7 complete chunks, no partial tail.
#
# NOTE: the recipe deliberately does NOT use flash4 — it requires SP=1 + SM90, and
# this line satisfies neither. Keep the triton default.
defaults:
  - models: wan21_i2v_14b_480p_proxy_dino_channel_concat
  - runtime: fsdp2_sp_kv
  - data: proxy_video_test_480p_81f

model:
  gradient_checkpointing: false
  proxy_dino:
    use_cached_latents: false
    video_context_time_axis: decoded
  image_condition:
    # Training used cached_grey_tail (reads the target's cached latent). Inference has no
    # target, so encode the condition clip online — the released encoding.
    first_frame_encoding: masked_video

runtime:
  attention_backend: {enabled: true, backend: native}
  sequence_parallel: {enabled: true, size: 1, axis: temporal, layout: balanced_blocks}
  kv_cache:
    enabled: true
    offload_generated_chunks: true
    context:
      max_latent_frames: null
      sink_latent_frames: 0
      debug_window: false
    quantized: false
    compression: none
  torch_compile: {enabled: false}

inference:
  strategy: chunk_causal
  outputs: [video]
  checkpoint: /path/to/ckpts/14b_480p/tf_v2
  checkpoint_source: model
  output_dir: inference/wan21_14b_480p_tf_v2
  max_batches: 0
  num_samples: 1
  height: 480
  width: 832
  num_frames: 81
  fps: 16
  chunk_size: 3
  pack_first_frame: true
  independent_first_frame: true
  num_inference_steps: 30
  guidance_scale: 5.0
  use_image_condition: true
  seed: 42
  output_type: np
  save_condition_videos: {video_context: proxy}
  scheduler:
    name: flow_euler
    schedule: shifted_linear
    shift: 3.0
    stretch: false
