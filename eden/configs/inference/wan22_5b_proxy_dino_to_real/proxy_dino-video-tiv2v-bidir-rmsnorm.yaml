# Inference-only config. The training recipe's model and runtime settings are
# inlined here so this file stands alone.
defaults:
- models: wan22_5b_proxy_dino_channel_concat
- runtime: fsdp2_sp
- data: proxy_video_test
model:
  proxy_dino:
    cfg_unconditional_control: zero
    channel_concat_rmsnorm: true
    checkpoint_path: /path/to/proxy-dino/best.pt
    use_cached_latents: false
    video_context_time_axis: decoded
  gradient_checkpointing: false
runtime:
  sequence_parallel:
    enabled: true
    size: 1
    axis: temporal
    layout: balanced_blocks
  kv_cache:
    enabled: false
inference:
  strategy: diffusion
  outputs:
  - video
  checkpoint: /path/to/ckpts/5b_720p/bidir_rmsnorm
  checkpoint_source: ema
  output_dir: inference/wan22_5b-proxy2fine-channelconcat-rmsnorm-stage0-bidirsft-datamixture-720p-lr2e5-proxytest5s-cfg20
  max_batches: 0
  num_samples: 1
  height: 704
  width: 1280
  num_frames: 121
  num_inference_steps: 48
  guidance_scale: 2.0
  negative_prompt: Vibrant colors, overexposed, static, blurry details, subtitles, style, artwork, painting,
    image, still, overall grayish, worst quality, low quality, JPEG compression residue, ugly, incomplete,
    extra fingers, poorly drawn hands, poorly drawn face, deformed, disfigured, deformed limbs, fused
    fingers, three legs
  seed: 42
  fps: 24
  output_type: np
  use_image_condition: true
  save_condition_videos:
    video_context: proxy
  scheduler:
    name: flow_unipc
    shift: 5.0
