# Inference-only config. The training recipe's model and runtime settings are
# inlined here so this file stands alone.
defaults:
- models: wan22_5b_proxy_dino_cross_attn
- runtime: fsdp2_sp
- data: proxy_video_test
model:
  proxy_dino:
    use_cached_latents: false
    video_context_time_axis: decoded
  gradient_checkpointing: false
runtime:
  sequence_parallel:
    enabled: true
    size: 1
    axis: temporal
    layout: balanced_blocks
  kv_cache:
    enabled: true
    context:
      max_latent_frames: null
      sink_latent_frames: 0
      debug_window: false
    quantized: false
    compression: none
inference:
  strategy: chunk_causal
  outputs:
  - video
  checkpoint: null
  output_dir: inference/wan22_5b_proxy_dino_cross_attn_tiv2v_tf_chunkar_gameblocks_medium_5s_ref
  max_batches: 0
  num_samples: 1
  height: 704
  width: 1280
  num_frames: 121
  chunk_size: 3
  num_inference_steps: 48
  guidance_scale: 5.0
  negative_prompt: Vibrant colors, overexposed, static, blurry details, subtitles, style, artwork, painting,
    image, still, overall grayish, worst quality, low quality, JPEG compression residue, ugly, incomplete,
    extra fingers, poorly drawn hands, poorly drawn face, deformed, disfigured, deformed limbs, fused
    fingers, three legs
  seed: 42
  fps: 24
  output_type: np
  use_image_condition: true
  save_condition_videos:
    video_context: proxy
  scheduler:
    name: flow_euler
    schedule: shifted_linear
    shift: 5.0
    stretch: false
