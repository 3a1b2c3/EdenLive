model:
  adapter: wan22_diffusers
  model_id: Wan-AI/Wan2.2-TI2V-5B-Diffusers
  torch_dtype: bfloat16
  local_files_only: true
  gradient_checkpointing: true
  max_sequence_length: 512
  proxy_dino:
    enabled: true
    # Override these paths for the local DINOv3 backbone and finetuned proxy.
    model_path: /path/to/dinov3-vitl16-pretrain-lvd1689m
    checkpoint_path: /path/to/proxy-dino/best.pt
    control_dim: 1024
    # This is the newly added Wan patch-embedding control slice (not the
    # frozen, checkpoint-loaded DINO patch projection). Keep it at zero so a
    # new run starts numerically equivalent to base Wan before finetuning.
    channel_concat_zero_init: true
    patchify_factor: 2
    image_size: [288, 512]
    vae_time_compression_ratio: 4
    use_cached_latents: true
    video_context_time_axis: latent
    local_files_only: true
    # How CFG's unconditional branch treats proxy control:
    # - zero: the unconditional branch uses zero DINO control, so guidance pushes
    #   along the proxy axis as well as text.
    # - same: control stays in both branches, so guidance varies text only.
    # This must match how the checkpoint was trained; the two are not interchangeable.
    cfg_unconditional_control: same
