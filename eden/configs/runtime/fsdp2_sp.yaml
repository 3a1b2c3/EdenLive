runtime:
  fsdp2:
    enabled: true
    meta_init: true
    mixed_precision: bf16
    # FSDP2 compute dtype. The sharded optimizer parameters stay FP32 unless
    # this is overridden; reduce-scatter defaults to that storage dtype.
    param_dtype: bf16
    reduce_dtype: fp32
    reshard_after_forward: true
    wrap_policy: transformer_block
  sequence_parallel:
    enabled: true
    size: 1
    axis: temporal
    layout: balanced_blocks
  # Optional block-level compilation. Keep disabled by default because it can
  # change numerics and compilation cost; opt in after validation.
  torch_compile:
    enabled: false
    backend: inductor
    mode: null
    fullgraph: false
    dynamic: false
    preserve_precision: false
  attention_backend:
    enabled: false
    backend: native
