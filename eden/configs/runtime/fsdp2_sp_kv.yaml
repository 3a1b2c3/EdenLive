runtime:
  fsdp2:
    enabled: true
    meta_init: true
    mixed_precision: bf16
    param_dtype: bf16
    reduce_dtype: fp32
    reshard_after_forward: true
    wrap_policy: transformer_block
  sequence_parallel:
    enabled: true
    size: 1
    axis: temporal
    layout: balanced_blocks
  torch_compile:
    enabled: false
    backend: inductor
    mode: null
    fullgraph: false
    dynamic: false
  attention_backend:
    enabled: false
    backend: native
  kv_cache:
    enabled: true
    # Keep completed chunk-AR latents on CPU; only the active chunk and KV
    # window remain resident on the execution device.
    offload_generated_chunks: true
    context:
      max_latent_frames: null
      sink_latent_frames: 0
      debug_window: false
    quantized: false
    compression: none
