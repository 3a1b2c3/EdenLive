# Wan2.1-I2V-14B (480p) + Proxy-DINO — bidirectional, all frames denoise jointly.
#
# Mirrors the training recipe's own validation block, so a checkpoint from that run is
# sampled the way it was evaluated during training.
#
# `cfg_unconditional_control: same` keeps the source-video proxy control in *both* CFG
# branches, so guidance varies text only. A checkpoint trained with `zero` — where the
# unconditional branch drops proxy control — needs `zero` here; not interchangeable.
#
# Frame math @16fps: 81 decoded -> 21 latent frames.

model:
  adapter: wan22_diffusers
  # The Wan2.1 I2V transformers do not overwrite latent frame 0. The DiT input is a
  # channel concat [noisy (16) | first-frame mask (4) | condition (16)] = 36 channels with
  # a *scalar* timestep, and cross-attention additionally takes CLIP image tokens. See
  # eden/models/adapters/wan22_diffusers/i2v_condition.py.
  #
  # A directory holding one subdirectory per component, Diffusers-style:
  #   vae/ text_encoder/ tokenizer/ scheduler/ transformer/ image_encoder/ image_processor/
  # No model_index.json is read; each component's loader class is fixed by the adapter.
  # Root of the component tree. Every path below is relative to it; an absolute
  # path there is used as written. Point this at your staged weights.
  pretrained_dir: models/EdenLive
  components:
    vae:
      path: vae-14b
    text_encoder:
      path: umt5/text_encoder
    tokenizer:
      path: umt5/tokenizer
    scheduler:
      path: scheduler-14b
    image_encoder:
      path: clip/image_encoder
    image_processor:
      path: clip/image_processor
    transformer:
      path: dit-14b-bidir
  # Point any single component somewhere else — this is how the DiT is swapped without
  # restaging the rest of the tree:
  #   components:
  #     transformer:
  #       path: /path/to/our-dit
  pipeline_class: WanImageToVideoPipeline
  # Single-expert release: no transformer_2, so no dual-expert switchover.
  boundary_ratio: null
  torch_dtype: bfloat16
  gradient_checkpointing: false
  max_sequence_length: 512
  # Official Wan2.1 I2V negative prompt (wan/configs/wan_i2v_14B.py prepends 镜头晃动).
  negative_prompt: 镜头晃动，色调艳丽，过曝，静态，细节模糊不清，字幕，风格，作品，画作，画面，静止，整体发灰，最差质量，低质量，JPEG压缩残留，丑陋的，残缺的，多余的手指，画得不好的手部，画得不好的脸部，畸形的，毁容的，形态畸形的肢体，手指融合，静止不动的画面，杂乱的背景，三条腿，背景人很多，倒着走
  image_condition:
    # image_dim 1280 + the shipped image_encoder -> auto resolves to true.
    clip_embeds: auto
    # The training recipe uses cached_grey_tail, which reads the *target's* cached latent.
    # Inference has no target, so encode the condition clip online — the released encoding:
    # VAE-encode [first frame, zeros x (F-1)] and mask it.
    first_frame_encoding: masked_video
    mode: mask_channel_concat
  proxy_dino:
    cfg_unconditional_control: same
    # The newly added control slice of the patch embedding starts at zero so the model is
    # numerically the released I2V model before finetuning.
    # The finetuned weights ship a trained RMSNorm over the proxy channels
    # (patch_embedding.condition_norm); without it that parameter is dropped.
    channel_concat_rmsnorm: true
    channel_concat_zero_init: true
    checkpoint_path: vision-encoder/projection.safetensors
    control_dim: 1024
    enabled: true
    # The frozen patch projection was finetuned at this size; the adapter resamples
    # control to the latent grid.
    image_size:
    - 480
    - 832
    local_files_only: true
    model_path: vision-encoder/backbone
    # Native 16px patches: one DINO token maps to one projected vector, so
    # patch_projection is (1024, 1024). This is the published projection's profile
    # and the one realtime/ serves; 2 would group 2x2 tokens and need a (1024, 4096)
    # projection trained that way.
    patchify_factor: 1
    # Offline inference decodes RGB source clips; cached target latents are training-only.
    use_cached_latents: false
    vae_time_compression_ratio: 4
    video_context_time_axis: decoded

runtime:
  fsdp2:
    enabled: true
    meta_init: true
    mixed_precision: bf16
    # FSDP2 compute dtype. The sharded parameters stay FP32 unless this is overridden;
    # reduce-scatter defaults to that storage dtype.
    param_dtype: bf16
    reduce_dtype: fp32
    reshard_after_forward: true
    wrap_policy: transformer_block
  sequence_parallel:
    axis: temporal
    enabled: true
    layout: balanced_blocks
    size: 1
  attention_backend:
    backend: native
    enabled: true
  # Block-level compilation can change numerics and costs compile time; opt in after
  # validation.
  torch_compile:
    backend: inductor
    dynamic: false
    enabled: false
    fullgraph: false
    mode: null
    preserve_precision: false

data:
  dataset:
    name: manifest
    params:
      columns:
        first_frame:
          condition: image
          loader: image
          params:
            height: 480
            resize_mode: center_crop
            value_range: -1,1
            width: 832
          required: true
        prompt:
          condition: text
          loader: text
          required: true
        proxy_video:
          condition: video_context
          loader: video
          params:
            # 832x480 at 16 fps, matching the recipes' validation geometry (81 decoded ->
            # 21 latent frames). Proxy-DINO reads the source clip on the *decoded*
            # timeline and the adapter strides every 4th frame itself, so the control clip
            # spans all 81 decoded frames rather than the 21 latent positions.
            clip_position: start
            duration_seconds: null
            duration_tolerance_seconds: 0.05
            fps: 16
            height: 480
            num_frames: 81
            num_threads: 2
            pad_short: false
            sampling: fps
            value_range: -1,1
            width: 832
          required: true
      id_column: id
      metadata_columns:
      - proxy_video
      - first_frame
      # Point these at your own manifest. The repo ships two runnable proxy recordings:
      # path=examples/samples/manifest.csv root=examples/samples.
      path: examples/samples/manifest.csv
      root: examples/samples
  batch_size: 1
  shuffle: false
  num_workers: 4
  pin_memory: true
  drop_last: false
  persistent_workers: true
  prefetch_factor: 1

inference:
  strategy: diffusion
  outputs:
  - video
  output_dir: inference/wan21_14b_480p_bidir
  max_batches: 0
  num_samples: 1
  height: 480
  width: 832
  num_frames: 81
  fps: 16
  num_inference_steps: 30
  guidance_scale: 5.0
  use_image_condition: true
  seed: 42
  output_type: np
  save_condition_videos:
    video_context: proxy
  # The 480P release's shipped scheduler_config carries flow_shift 3.0 (the 720P one uses
  # 5.0) and the official generate.py samples 832x480 at 3.0.
  scheduler:
    name: flow_euler
    schedule: shifted_linear
    shift: 3.0
    stretch: false
