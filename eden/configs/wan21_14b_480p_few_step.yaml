# Wan2.1-I2V-14B (480p) + Proxy-DINO — few-step (self-gradient-forcing / rollout DMD),
# 4 steps per chunk, near real time.
#
# Mirrors the training recipe's validation block.
#
# Two settings distinguish it from the teacher-forcing config: an explicit four-entry
# timestep list, and a bounded KV window (18 latent frames + 6 sink) rather than
# unbounded context.

model:
  adapter: wan22_diffusers
  # The Wan2.1 I2V transformers do not overwrite latent frame 0. The DiT input is a
  # channel concat [noisy (16) | first-frame mask (4) | condition (16)] = 36 channels with
  # a *scalar* timestep, and cross-attention additionally takes CLIP image tokens. See
  # eden/models/adapters/wan22_diffusers/i2v_condition.py.
  #
  # A directory holding one subdirectory per component, Diffusers-style:
  #   vae/ text_encoder/ tokenizer/ scheduler/ transformer/ image_encoder/ image_processor/
  # No model_index.json is read; each component's loader class is fixed by the adapter.
  pretrained_dir: /path/to/eden-wan21-14b-480p
  # Point any single component somewhere else — this is how the DiT is swapped without
  # restaging the rest of the tree:
  #   components:
  #     transformer:
  #       path: /path/to/our-dit
  pipeline_class: WanImageToVideoPipeline
  # Single-expert release: no transformer_2, so no dual-expert switchover.
  boundary_ratio: null
  torch_dtype: bfloat16
  gradient_checkpointing: false
  max_sequence_length: 512
  # Official Wan2.1 I2V negative prompt (wan/configs/wan_i2v_14B.py prepends 镜头晃动).
  negative_prompt: 镜头晃动，色调艳丽，过曝，静态，细节模糊不清，字幕，风格，作品，画作，画面，静止，整体发灰，最差质量，低质量，JPEG压缩残留，丑陋的，残缺的，多余的手指，画得不好的手部，画得不好的脸部，畸形的，毁容的，形态畸形的肢体，手指融合，静止不动的画面，杂乱的背景，三条腿，背景人很多，倒着走
  image_condition:
    # image_dim 1280 + the shipped image_encoder -> auto resolves to true.
    clip_embeds: auto
    # Training used cached_grey_tail (reads the target's cached latent). Inference has no
    # target, so encode the condition clip online — the released encoding.
    first_frame_encoding: masked_video
    mode: mask_channel_concat
  proxy_dino:
    # This checkpoint was trained with `zero`: the unconditional CFG branch drops proxy
    # control, so guidance pushes along the proxy axis as well as text. Not interchangeable
    # with `same`.
    cfg_unconditional_control: zero
    channel_concat_zero_init: true
    checkpoint_path: /path/to/proxy-dino/best.pt
    control_dim: 1024
    enabled: true
    # The frozen patch projection was finetuned at this size; the adapter resamples
    # control to the latent grid.
    image_size:
    - 288
    - 512
    local_files_only: true
    model_path: /path/to/dinov3-vitl16-pretrain-lvd1689m
    patchify_factor: 2
    # Offline inference decodes RGB source clips; cached target latents are training-only.
    use_cached_latents: false
    vae_time_compression_ratio: 4
    video_context_time_axis: decoded

runtime:
  fsdp2:
    enabled: true
    meta_init: true
    mixed_precision: bf16
    param_dtype: bf16
    reduce_dtype: fp32
    reshard_after_forward: true
    wrap_policy: transformer_block
  sequence_parallel:
    axis: temporal
    enabled: true
    layout: balanced_blocks
    size: 1
  attention_backend:
    backend: native
    enabled: true
  torch_compile:
    backend: inductor
    dynamic: false
    enabled: false
    fullgraph: false
    mode: null
  kv_cache:
    compression: none
    context:
      debug_window: false
      # Bounded sliding window: 18 attendable latent frames plus 6 always-resident sink
      # frames at the start of the rollout.
      max_latent_frames: 18
      sink_latent_frames: 6
    enabled: true
    # Keep completed chunk-AR latents on CPU; only the active chunk and KV window remain
    # resident on the execution device.
    offload_generated_chunks: true
    quantized: false

data:
  dataset:
    name: manifest
    params:
      columns:
        first_frame:
          condition: image
          loader: image
          params:
            height: 480
            resize_mode: center_crop
            value_range: -1,1
            width: 832
          required: true
        prompt:
          condition: text
          loader: text
          required: true
        proxy_video:
          condition: video_context
          loader: video
          params:
            # 832x480 at 16 fps, matching the recipes' validation geometry (81 decoded ->
            # 21 latent frames). Proxy-DINO reads the source clip on the *decoded*
            # timeline and the adapter strides every 4th frame itself, so the control clip
            # spans all 81 decoded frames rather than the 21 latent positions.
            clip_position: start
            duration_seconds: null
            duration_tolerance_seconds: 0.05
            fps: 16
            height: 480
            num_frames: 81
            num_threads: 2
            pad_short: false
            sampling: fps
            value_range: -1,1
            width: 832
          required: true
      id_column: id
      metadata_columns:
      - proxy_video
      - first_frame
      # Point these at your own manifest. The repo ships two runnable proxy recordings:
      # path=examples/samples/manifest.csv root=examples/samples.
      path: /path/to/proxy_manifest.csv
      root: /path/to/proxy_dataset
  batch_size: 1
  shuffle: false
  num_workers: 4
  pin_memory: true
  drop_last: false
  persistent_workers: true
  prefetch_factor: 1

inference:
  strategy: chunk_causal
  outputs:
  - video
  checkpoint: /path/to/ckpts/14b_480p/few_step
  checkpoint_source: ema
  output_dir: inference/wan21_14b_480p_few_step
  max_batches: 0
  num_samples: 1
  height: 480
  width: 832
  num_frames: 81
  fps: 16
  chunk_size: 3
  pack_first_frame: true
  independent_first_frame: true
  num_inference_steps: 4
  guidance_scale: 1.0
  use_image_condition: true
  seed: 42
  output_type: np
  save_condition_videos:
    video_context: proxy
  # The distilled student samples this fixed four-timestep schedule; num_inference_steps
  # above must match its length.
  scheduler:
    name: flow_euler
    stochastic_sampling: true
    timesteps:
    - 1000
    - 900.0
    - 750.0
    - 500.0
