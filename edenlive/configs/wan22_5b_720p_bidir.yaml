# Wan 2.2 5B bidirectional video inference.
# Recording metadata supplies the actual frame count and temporal prompts.
model:
  adapter: wan22_diffusers
  pretrained_dir: models/EdenLive
  components:
    vae:
      path: vae-5b
    text_encoder:
      path: umt5/text_encoder
    tokenizer:
      path: umt5/tokenizer
    scheduler:
      path: scheduler-5b
    transformer:
      path: dit-5b-bidir
  pipeline_class: WanPipeline
  expand_timesteps: true
  torch_dtype: bfloat16
  max_sequence_length: 512
  # flash4 is accepted only on SM90: the adapter tests compute capability for
  # equality with (9, 0), so no CUDA or torch version admits Blackwell. triton
  # is the only other backend the validator allows.
  teacher_forcing_attention_backend: triton
  proxy_dino:
    cfg_unconditional_control: same
    channel_concat_rmsnorm: false
    channel_concat_zero_init: true
    checkpoint_path: vision-encoder/projection.safetensors
    control_dim: 1024
    enabled: true
    image_size:
    - 480
    - 832
    local_files_only: true
    model_path: vision-encoder/backbone
    patchify_factor: 1
    use_cached_latents: false
    vae_time_compression_ratio: 4
    video_context_time_axis: latent
    resize_mode: bilinear
    projection_autocast: true
  dynamic_prompt:
    # This profile requires flash4 and cannot fall back, so on non-SM90 it is
    # disabled rather than switched. The timestamped prompts in prompts.json are
    # then ignored and staticPrompt applies throughout; geometry and motion still
    # come from the reference video.
    enabled: false
    backend: flash4
runtime:
  fsdp2:
    enabled: false
  sequence_parallel:
    enabled: false
    size: 1
  attention_backend:
    enabled: false
    backend: native
  torch_compile:
    enabled: false
  kv_cache:
    enabled: false
data:
  dataset:
    name: recording_manifest
    params:
      path: examples/samples/manifest.csv
      root: examples/samples
      width: 1280
      height: 704
      fps: 24
      max_frames: 121
      text_mode: timeline
      dynamic: true
      chunk_size: 3
  batch_size: 1
  shuffle: false
  num_workers: 0
  pin_memory: true
  drop_last: false
inference:
  strategy: diffusion
  outputs:
  - video
  num_samples: 1
  height: 704
  width: 1280
  num_frames: 121
  max_frames: 121
  fps: 24
  num_inference_steps: 48
  guidance_scale: 3.0
  negative_prompt: 色调艳丽，过曝，静态，细节模糊不清，字幕，风格，作品，画作，画面，静止，整体发灰，最差质量，低质量，JPEG压缩残留，丑陋的，残缺的，多余的手指，画得不好的手部，画得不好的脸部，畸形的，毁容的，形态畸形的肢体，手指融合，静止不动的画面，杂乱的背景，三条腿，背景人很多
  seed: 42
  output_type: np
  use_image_condition: true
  scheduler:
    name: flow_unipc
    shift: 5.0
  output_dir: inference/wan22_5b_720p_bidir
  max_batches: 0
  save_condition_videos:
    video_context: proxy
  condition_video_fps:
    video_context: 6
