[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flashdreams-cam2v"
version = "0.1.0"
description = "Reusable interactive FlashDreams camera-to-video application primitives"
readme = "README.md"
requires-python = ">=3.10"
# `local-window` (a Dear ImGui viewport) is not part of serving.
dependencies = ["flashdreams[runners,serving]"]

[project.entry-points."flashdreams.applications_v2"]
"cam2v-dummy" = "cam2v.dummy:create_app"


[tool.setuptools.packages.find]
include = ["cam2v*"]

[tool.setuptools.package-data]
cam2v = ["assets/*.ppm"]
