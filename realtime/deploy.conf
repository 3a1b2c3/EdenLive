# Deployment settings for the Game2V realtime services. Edit this file; the
# launch scripts read it and pass nothing of their own.
#
# Shell syntax (KEY=value), sourced by launch.sh, start.sh, turn_server.sh,
# workbench_bridge.sh and workbench_flux.sh.


# --- Weights ------------------------------------------------------------------

# Directory holding the published weight tree: dit-5b/, dit-14b/, umt5/,
# vae-5b/, vae-14b/, decoder-5b/, vision-encoder/, clip/, flux-c2f/.
# Relative paths are read from the repository root.
#
# A pipeline config in integrations_v2/eden/configs/ can name its own
# `model_root`, which wins over this one.
MODEL_ROOT=models/EdenLive


# --- The model app ------------------------------------------------------------

# Address the page is served on. 0.0.0.0 accepts connections from other hosts.
APP_HOST=0.0.0.0
APP_PORT=8089

# Ranks torchrun starts, one per GPU. Set it to the GPU count you want to use.
NPROC=2

# Which game's cover the session falls back to. Slugs: games/registry.json.
GAME=subway-run


# --- TURN relay ---------------------------------------------------------------

# A browser on another subnet usually has no direct UDP path to the server, and
# its connection stalls in "connecting" without a relay. turn_server.sh runs
# one; set TURN_HOST to its address and TURN_SECRET to the credential it
# requires.
#
# Leave TURN_HOST empty to skip the relay. That only works when the browser and
# the server share a subnet -- and an address pointing at a relay that is not
# running is worse than none, because the browser stalls for ten seconds before
# failing instead of falling back.
TURN_HOST=
TURN_PORT=3478
TURN_USERNAME=flashdreams
TURN_SECRET=

# Interface turn_server.sh reads its relay address off, when started without an
# explicit IP.
TURN_IFACE=eth0


# --- Workbench ----------------------------------------------------------------

# The bridge runs the game-generation jobs, on whichever host has the `claude`
# CLI installed -- not necessarily the GPU host. BRIDGE_HOST is the address it
# binds to and the one the app proxies to, so it has to be reachable from the
# GPU host. Empty means the first address `hostname -I` reports.
BRIDGE_HOST=
BRIDGE_PORT=8091

# The FLUX worker renders the photoreal first frame. It is reached over
# loopback, so it has to run on the GPU host.
FLUX_HOST=127.0.0.1
FLUX_PORT=8092

# GPU index for the FLUX worker. Put it on a GPU the model app is not using, or
# on the last rank's: rank 0 owns Chromium and the proxy-DINO encode, so it is
# the worst one to share with.
FLUX_GPU=1
