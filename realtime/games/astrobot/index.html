<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101e42">
  <meta name="description" content="A small space robot. Seven giant moonstones. Twelve golden discoveries. Run, jump and collect them all.">
  <title>Moonstone Run · Astrobot (Prototype)</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='5' y='12' width='54' height='45' rx='19' fill='%23eef8ff'/%3E%3Crect x='13' y='23' width='38' height='23' rx='10' fill='%2311264a'/%3E%3Cpath d='M24 30v8m16-8v8' stroke='%2365efff' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/assets/user-interface/game-ui.css">
  <link rel="stylesheet" href="./ui/moonstone.css">
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="/shared/recorder/recorder.css">
  <script type="importmap">{"imports":{"three":"/vendor/three.module.js"}}</script>
</head>
<body>
  <div id="view-big">
    <div id="app" aria-label="Moonstone Run 3D game"></div>
  </div>
  <aside id="right">
    <section id="desc-panel">
      <span class="eyebrow desc-label">SCENE DESCRIPTION</span>
      <p class="desc-fixed"></p><!-- filled by the host from registry.json at boot -->
      <span class="eyebrow desc-label desc-label-live">LIVE EVENTS</span>
      <div class="desc-dynamic" role="status" aria-live="polite" aria-label="dynamic event text"></div>
    </section>
    <div id="record-bar">
      <button id="record-btn" type="button"><span class="record-dot" aria-hidden="true"></span><span class="record-label">Start recording</span></button>
      <span id="record-status">Main-view recording · auto-saves a ZIP on stop</span>
    </div>
    <div id="view-small">
      <div id="small-stage">
        <canvas id="small-canvas" aria-hidden="true"></canvas>
      </div>
    </div>
  </aside>
  <div id="fatal" role="alert" style="display:none"></div>
  <script type="module" src="/shared/host/play-page.js"></script>
</body>
</html>
