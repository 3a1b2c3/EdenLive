<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>City Walk</title>
<link rel="stylesheet" href="./style.css">
<link rel="stylesheet" href="/shared/recorder/recorder.css">
<script type="importmap">{"imports":{"three":"/vendor/three.module.js"}}</script>
</head><body>
<div id="view-big">
  <div id="app"></div>
  <div id="result-big" class="result" role="dialog" aria-modal="true" aria-labelledby="big-result-title" hidden>
    <div class="card">
      <h1 id="big-result-title"></h1>
      <p id="big-result-text"></p>
      <button id="big-resume-btn" type="button" hidden>Resume</button>
      <button id="big-restart-btn" type="button">Walk again</button>
      <small id="big-result-hint">Press R to restart</small>
    </div>
  </div>
</div>
<aside id="right">
  <section id="desc-panel">
    <p class="desc-fixed"></p>
    <div class="desc-dynamic" role="status" aria-live="polite"></div>
  </section>
  <div id="record-bar">
    <button id="record-btn" type="button"><span class="record-dot" aria-hidden="true"></span><span class="record-label">Start recording</span></button>
    <span id="record-status">Main-view recording · auto-saves a ZIP on stop</span>
  </div>
  <div id="view-small"><div id="small-stage"><canvas id="small-canvas" aria-hidden="true"></canvas><div id="hud">
    <div class="panel" id="score-panel">
      <div class="label">Score</div>
      <div class="score-line"><span id="score">0</span><small id="score-target"> / 100</small></div>
      <div class="meter" role="progressbar" aria-label="Score progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="score-bar"></i></div>
    </div>
    <div class="panel" id="clock-panel">
      <div class="label">Time left</div>
      <div id="clock">0:30</div>
      <div id="clock-bonus"></div>
    </div>
    <div class="panel" id="guide">
      <span id="guide-arrow" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 2 L20 20 L12 15 L4 20 Z"/></svg></span>
      <span id="guide-text">Nearest ring</span>
    </div>
    <div id="toast">+10</div>
    <div class="panel" id="traffic">Cars yielding: <b id="yielding">0</b></div>
    <div class="panel" id="controls"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> walk &nbsp; <kbd>I</kbd><kbd>J</kbd><kbd>K</kbd><kbd>L</kbd> camera &nbsp; <kbd>P</kbd> pause &nbsp; <kbd>R</kbd> restart</div>
    <div id="result" class="result" role="dialog" aria-modal="true" aria-labelledby="result-title" hidden>
      <div class="card">
        <h1 id="result-title"></h1>
        <p id="result-text"></p>
        <button id="resume-btn" type="button" hidden>Resume</button>
        <button id="restart-btn" type="button">Walk again</button>
        <small id="result-hint">Press R to restart</small>
      </div>
    </div>
  </div></div></div>
</aside>
<div id="fatal" role="alert" style="display:none"></div>
<script type="module" src="/shared/host/play-page.js"></script>
</body></html>
