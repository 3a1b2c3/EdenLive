<!--
  Runnable static-scene skeleton. This is the exact DOM contract the stage-1
  checker (forge/check_step1.py) and the review viewer (forge/serve_step.py) expect:

    - import map pins `three` and `@dimforge/rapier3d-compat` to the server's /vendor/
      builds (three@0.161.0 + rapier3d-compat@0.14.0, resolved by serve_step.py)
    - `#app` container: PrototypeShell.createRenderer() appends its own <canvas> here
      (do NOT hand-write a second <canvas> -- the checker reads the first one it finds)
    - `#app canvas` is pinned to the container's CSS box. installResize() calls
      setSize(cssWidth, cssHeight, false), which updates the drawing buffer only;
      without this CSS, a pixelRatio > 1 overflows the window and crops the view.
    - `#hud`: the label/value HUD target (makeHudWriter writes into it)
    - `#fatal`: hidden error panel; the bootstrap below sets display:'block' and the
      exception text, which is how the checker reports "the page threw" instead of
      "no <canvas>"
    - the <script type="module"> bootstrap loads './main.js' and calls start(),
      reporting module-load and startup failures in #fatal; the checker waits for
      a canvas + window.__scene

  Every run imports the library via absolute `/assets/...` specifiers (the server
  serves the output project root) and resolves bare `three` from its local npm
  dependency here. Copy only needed assets into that project. main.js must set
  `window.__scene = { scene, camera }` for the framing check.
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lantern Yard</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0b0e14; overflow: hidden; }
    #app { position: absolute; inset: 0; }
    #app canvas { display: block; width: 100%; height: 100%; }
    #hud {
      position: absolute; left: 16px; top: 16px; z-index: 5; pointer-events: none;
      display: flex; gap: 14px; align-items: stretch;
      font: 600 15px/1.3 Georgia, 'Times New Roman', serif; color: #ffe7c2;
    }
    .panel {
      background: rgba(24, 18, 34, 0.78); border: 1px solid rgba(255, 176, 74, 0.45);
      border-radius: 10px; padding: 8px 14px; box-shadow: 0 0 18px rgba(255, 150, 50, 0.18);
    }
    .label { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: #d9b98c; }
    #lantern-pips { display: flex; gap: 6px; margin-top: 5px; }
    .pip { width: 16px; height: 20px; border-radius: 8px 8px 6px 6px; background: #3b3046; border: 1px solid #6b5a4a; }
    .pip.lit { background: radial-gradient(circle at 50% 40%, #fff3c4, #ffb347 55%, #e0711c); border-color: #ffcf7a; box-shadow: 0 0 10px #ff9a2e; }
    #time-value { font-size: 22px; margin-top: 2px; }
    #time-value.low { color: #ff7a5c; }
    #hint { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 5; pointer-events: none;
      font: 13px/1.4 Georgia, serif; color: #e9d6b8; background: rgba(24, 18, 34, 0.6); padding: 5px 14px; border-radius: 999px; }
    #result { position: absolute; inset: 0; z-index: 10; display: none; align-items: center; justify-content: center;
      background: rgba(10, 8, 20, 0.45); pointer-events: none; }
    #result.show { display: flex; }
    #result .card { min-width: 320px; text-align: center; padding: 22px 34px; border-radius: 14px;
      background: rgba(28, 20, 40, 0.92); border: 1px solid rgba(255, 176, 74, 0.6); color: #ffe7c2;
      font: 16px/1.5 Georgia, serif; box-shadow: 0 0 40px rgba(255, 150, 50, 0.25); }
    #result h2 { margin: 0 0 6px; font-size: 32px; letter-spacing: 0.04em; }
    #result.lost h2 { color: #ff8a6a; }
    #result.won h2 { color: #ffd27a; }
    #result .again { margin-top: 12px; font-size: 14px; color: #d9b98c; }
    kbd { font: 600 13px ui-monospace, monospace; padding: 1px 6px; border-radius: 4px; border: 1px solid #a0896a; background: #2a2236; }
    #fatal {
      position: absolute; left: 12px; bottom: 12px; z-index: 20;
      max-width: 80vw; padding: 10px 12px; display: none;
      color: #ffd9d9; background: rgba(120, 20, 20, 0.9);
      font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
      white-space: pre-wrap; border-radius: 6px;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "/vendor/three.module.js",
      "@dimforge/rapier3d-compat": "/vendor/rapier.es.js"
    }
  }
  </script>
</head>
<body>
  <div id="app"></div>
  <div id="hud" data-game-ui>
    <div class="panel"><div class="label">Lanterns <span id="lantern-count">0/5</span></div><div id="lantern-pips"></div></div>
    <div class="panel"><div class="label">Time</div><div id="time-value">90</div></div>
  </div>
  <div id="hint" data-game-ui>Collect five lanterns, avoid the guard &middot; <kbd>WASD</kbd> walk &middot; mouse / <kbd>Q</kbd><kbd>E</kbd> look &middot; <kbd>Shift</kbd> sprint &middot; <kbd>R</kbd> restart</div>
  <div id="result" data-game-ui role="status" aria-live="polite"><div class="card"><h2 id="result-title"></h2><div id="result-reason"></div><div class="again">Press <kbd>R</kbd> to play again</div></div></div>
  <div id="fatal" style="display:none"></div>
  <script type="module">
    import('./main.js').then(({ start }) => start()).catch((err) => {
      const fatal = document.getElementById('fatal');
      fatal.style.display = 'block';
      fatal.textContent = err?.stack ?? String(err);
    });
  </script>
</body>
</html>
