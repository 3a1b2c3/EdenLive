<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEON CLASH · Street Duel</title>
<link rel="stylesheet" href="./style.css">
<link rel="stylesheet" href="/shared/recorder/recorder.css">
<script type="importmap">{"imports":{"three":"/vendor/three.module.js"}}</script>
</head><body>
<div id="view-big">
  <div id="app"></div>
  <div id="overlay-big" role="dialog" aria-modal="true" aria-labelledby="big-result-title" hidden><div class="result"><span id="big-result-kicker"></span><h1 id="big-result-title"></h1><p id="big-result-text"></p><div id="big-result-stats" class="result-stats"></div><button id="big-resume" hidden>CONTINUE</button><button id="big-restart">PLAY AGAIN <span>↗</span></button><small id="big-result-hint">PRESS R TO RESTART</small></div></div>
</div>
<aside id="right">
  <section id="desc-panel">
    <p class="desc-fixed"></p>
    <div class="desc-dynamic" role="status" aria-live="polite"></div>
  </section>
  <div id="record-bar">
    <button id="record-btn" type="button"><span class="record-dot" aria-hidden="true"></span><span class="record-label">Start recording</span></button>
    <span id="record-status">Main-view recording · auto-saves a ZIP on stop</span>
  </div>
  <div id="view-small"><div id="small-stage"><canvas id="small-canvas" aria-hidden="true"></canvas><div id="hud">
    <header><div class="brand"><span>ARCADE SERIES / 001</span><strong>NEON CLASH</strong></div><div class="chapter"><span>ROUND 01</span><b>STREET DUEL</b></div><button id="pause" title="Pause (P)" aria-label="Pause game">Ⅱ</button></header>
    <section class="status player-hud">
      <div class="fighter-name"><span><b>KAI</b><small>YOU / THE CHALLENGER</small></span><em id="player-hp">100</em></div>
      <div class="health-track"><div id="player-trail" class="health-trail"></div><div id="player-health" class="health-fill"></div></div>
    </section>
    <section class="objective rival-hud">
      <div class="fighter-name"><em id="rival-hp">100</em><span><b>RAZE</b><small>CPU / THE STREET KING</small></span></div>
      <div class="health-track"><div id="rival-trail" class="health-trail"></div><div id="rival-health" class="health-fill"></div></div>
    </section>
    <div class="versus"><span>ROUND 01</span><strong>VS</strong><small id="match-clock">00:00</small></div>
    <div id="feedback" class="feedback" aria-live="polite"></div>
    <div id="round-banner" class="round-banner" hidden></div>
    <footer>
      <div class="controls">
        <span><kbd>A D</kbd> MOVE</span>
        <span><kbd>W / SPACE</kbd> JUMP</span>
        <span><kbd>J</kbd> PUNCH</span>
        <span><kbd>K</kbd> KICK</span>
        <span><kbd>L</kbd> GUARD</span>
        <span><kbd>P</kbd> PAUSE</span>
      </div>
      <div class="abilities"><span id="round-state">STREET DUEL</span></div>
    </footer>
    <div id="overlay" role="dialog" aria-modal="true" aria-labelledby="result-title" hidden><div class="result"><span id="result-kicker"></span><h1 id="result-title"></h1><p id="result-text"></p><div id="result-stats" class="result-stats"></div><button id="resume" hidden>CONTINUE</button><button id="restart">PLAY AGAIN <span>↗</span></button><small id="result-hint">PRESS R TO RESTART</small></div></div>
    <div class="touch" aria-label="Touch controls">
      <div class="dpad">
        <button data-action="jump" class="up" aria-label="Jump">↑</button>
        <button data-action="left" class="left" aria-label="Move left">←</button>
        <button data-action="right" class="right" aria-label="Move right">→</button>
      </div>
      <div class="touch-actions">
        <button data-action="guard" aria-label="Guard">GUARD</button>
        <button data-action="kick" aria-label="Kick">KICK</button>
        <button data-action="punch" aria-label="Punch" class="strike">HIT</button>
      </div>
    </div>
  </div></div></div>
</aside>
<div id="fatal" role="alert" style="display:none"></div>
<script type="module" src="/shared/host/play-page.js"></script>
</body></html>
