<!--
  Runnable static-scene skeleton. This is the exact DOM contract the stage-1
  checker (forge/check_step1.py) and the review viewer (forge/serve_step.py) expect:

    - import map pins `three` and `@dimforge/rapier3d-compat` to the server's /vendor/
      builds (three@0.161.0 + rapier3d-compat@0.14.0, resolved by serve_step.py)
    - `#app` container: PrototypeShell.createRenderer() appends its own <canvas> here
      (do NOT hand-write a second <canvas> -- the checker reads the first one it finds)
    - `#app canvas` is pinned to the container's CSS box. installResize() calls
      setSize(cssWidth, cssHeight, false), which updates the drawing buffer only;
      without this CSS, a pixelRatio > 1 overflows the window and crops the view.
    - `#hud`: the label/value HUD target (makeHudWriter writes into it)
    - `#fatal`: hidden error panel; the bootstrap below sets display:'block' and the
      exception text, which is how the checker reports "the page threw" instead of
      "no <canvas>"
    - the <script type="module"> bootstrap loads './main.js' and calls start(),
      reporting module-load and startup failures in #fatal; the checker waits for
      a canvas + window.__scene

  Every run imports the library via absolute `/assets/...` specifiers (the server
  serves the output project root) and resolves bare `three` from its local npm
  dependency here. Copy only needed assets into that project. main.js must set
  `window.__scene = { scene, camera }` for the framing check.
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nitro Kart Rush</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0b0e14; overflow: hidden; }
    #app { position: absolute; inset: 0; }
    #app canvas { display: block; width: 100%; height: 100%; }
    #hud { position: absolute; inset: 0; z-index: 5; pointer-events: none;
      font: 600 14px/1.3 "Trebuchet MS", "Segoe UI", sans-serif; color: #fff; }
    .panel { position: absolute; background: linear-gradient(135deg, rgba(40,20,90,0.82), rgba(10,40,90,0.78));
      border: 2px solid rgba(255,255,255,0.55); border-radius: 14px; box-shadow: 0 4px 14px rgba(0,0,0,0.35);
      text-shadow: 0 1px 2px rgba(0,0,0,0.6); }
    #pos { left: 14px; top: 14px; padding: 6px 14px; display: flex; align-items: baseline; gap: 4px; }
    #pos b { font-size: 40px; color: #ffd166; } #pos span { font-size: 16px; opacity: 0.85; }
    #race { left: 50%; top: 14px; transform: translateX(-50%); padding: 6px 16px; display: flex; gap: 18px; font-size: 18px; }
    #race em { font-style: normal; color: #8fe3ff; font-size: 12px; display: block; letter-spacing: 1px; }
    #race .low { color: #ff6b6b; }
    #meter { right: 14px; bottom: 14px; padding: 10px 14px; width: 210px; }
    #meter .spd { font-size: 34px; color: #fff; } #meter .spd small { font-size: 13px; opacity: 0.8; }
    #meter .row { display: flex; align-items: center; gap: 6px; margin-top: 6px; font-size: 12px; letter-spacing: 1px; }
    .cells { display: flex; gap: 5px; }
    .cells i { width: 40px; height: 16px; border: 2px solid #4cc9f0; border-radius: 4px; background: rgba(0,0,0,0.3); }
    .cells i.on { background: linear-gradient(90deg, #4cc9f0, #7b2ff7); box-shadow: 0 0 10px #4cc9f0; }
    .charge { flex: 1; height: 8px; background: rgba(0,0,0,0.4); border-radius: 4px; overflow: hidden; }
    .charge b { display: block; height: 100%; background: linear-gradient(90deg, #ffd166, #ff7b00); }
    .tags { height: 18px; margin-top: 4px; font-size: 13px; }
    .tag { color: #ffd166; margin-right: 8px; } .tag.boost { color: #4cc9f0; }
    #keys { left: 14px; bottom: 14px; padding: 6px 12px; font-size: 12px; font-weight: 500; opacity: 0.9; }
    #banner { position: absolute; left: 50%; top: 26%; transform: translateX(-50%); z-index: 6; display: none;
      color: #fff; font: 900 64px/1.1 "Trebuchet MS", sans-serif; text-shadow: 0 4px 0 #7b2ff7, 0 6px 14px #000;
      pointer-events: none; text-align: center; white-space: nowrap; }
    #banner.hint { font-size: 22px; text-shadow: 0 2px 6px #000; top: 30%; }
    #result { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 7; display: none;
      min-width: 320px; padding: 18px 26px; text-align: center; pointer-events: none;
      color: #f4f6ff; font: 600 15px/1.35 "Trebuchet MS", "Segoe UI", sans-serif; }
    #result h1 { margin: 0 0 4px; font-size: 34px; color: #ffd166; } #result.lost h1 { color: #ff8fa3; }
    #result p { margin: 4px 0 10px; font-size: 15px; opacity: 0.9; }
    #result ol { text-align: left; margin: 0 auto 12px; padding-left: 24px; width: 220px; font-size: 15px; }
    #result li.me { color: #ffd166; }
    #result .again { display: inline-block; padding: 6px 14px; border-radius: 999px; background: #ff3d7f; font-size: 15px; }
    #fatal {
      position: absolute; left: 12px; bottom: 12px; z-index: 20;
      max-width: 80vw; padding: 10px 12px; display: none;
      color: #ffd9d9; background: rgba(120, 20, 20, 0.9);
      font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
      white-space: pre-wrap; border-radius: 6px;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "/vendor/three.module.js",
      "@dimforge/rapier3d-compat": "/vendor/rapier.es.js"
    }
  }
  </script>
</head>
<body>
  <div id="app"></div>
  <div id="hud" data-game-ui>
    <div id="pos" class="panel"><b>1</b><span>/ 4</span></div>
    <div id="race" class="panel"><div><em>LAP</em><span id="lap">1/2</span></div><div><em>TIME</em><span id="time">120.0</span></div></div>
    <div id="meter" class="panel"><div class="spd"><span id="spd">0</span> <small>km/h</small></div>
      <div class="row">NITRO <div class="cells" id="cells"></div></div>
      <div class="row">DRIFT <div class="charge"><b id="charge"></b></div></div>
      <div class="tags" id="tags"></div></div>
    <div id="keys" class="panel">W accelerate &middot; A/D steer &middot; S brake &middot; Shift drift &middot; Space nitro</div>
  </div>
  <div id="banner" data-game-ui></div>
  <div id="result" class="panel" data-game-ui role="dialog" aria-live="polite"></div>
  <div id="fatal" style="display:none"></div>
  <script type="module">
    import('./main.js').then(({ start }) => start()).catch((err) => {
      const fatal = document.getElementById('fatal');
      fatal.style.display = 'block';
      fatal.textContent = err?.stack ?? String(err);
    });
  </script>
</body>
</html>
