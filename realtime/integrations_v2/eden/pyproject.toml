[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flashdreams-eden"
version = "0.1.0"
description = "Eden World Cam2V integration for FlashDreams v2."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flashdreams",
    "flashdreams-cam2v",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.entry-points."flashdreams.applications_v2"]
"cam2v-eden" = "eden.apps.cam2v.adapter:create_app"
"cam2v-eden-world-fast" = "eden.apps.cam2v.adapter:create_app_fast"
"cam2v-eden-world-fast-taehv-window15-sink3" = "eden.apps.cam2v.adapter:create_app_fast_taehv_window15_sink3"
"cam2v-eden-world-v2-14b-causal-fast" = "eden.apps.cam2v.adapter:create_app_v2_14b_causal_fast"
"cam2v-eden-world-v2-14b-causal-fast-taehv-window18-sink6" = "eden.apps.cam2v.adapter:create_app_v2_14b_causal_fast_taehv_window18_sink6"
"cam2v-eden-world-v2-1.3b-causal-fast" = "eden.apps.cam2v.adapter:create_app_v2_1pt3b_causal_fast"
"cam2v-eden-world-v2-1.3b-causal-fast-taehv-window18-sink6" = "eden.apps.cam2v.adapter:create_app_v2_1pt3b_causal_fast_taehv_window18_sink6"
"cam2v-eden-world-v2-14b-causal-pretrain" = "eden.apps.cam2v.adapter:create_app_v2_14b_causal_pretrain"
"game2v-eden-world-v2-14b-taehv" = "eden.apps.game2v.adapter:create_app_v2_14b_taehv"
"game2v-eden-world-v2-5b-taehv" = "eden.apps.game2v.adapter:create_app_v2_5b_taehv"

[tool.setuptools.package-data]
eden = ["configs/*.yaml"]

[tool.setuptools]
packages = [
    "eden",
    "eden.apps",
    "eden.apps.cam2v",
    "eden.apps.game2v",
    "eden.impl",
    "eden.impl.encoder",
    "eden.impl.game14b",
    "eden.impl.game5b",
    "eden.impl.transformer",
    "eden.impl.transformer.impl",
]

[tool.setuptools.package-dir]
eden = "."

[tool.uv]
managed = true
